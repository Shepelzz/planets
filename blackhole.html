<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Чорна діра — прототип</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; border-radius: 12px;
        background: rgba(10, 14, 28, 0.7); color: #cfd8ea; font: 13px/1.5 -apple-system, system-ui, sans-serif;
      }
      #hud b { color: #fff; }
      #hud button {
        margin: 6px 6px 0 0; padding: 6px 10px; border: 0; border-radius: 8px;
        background: rgba(255, 255, 255, 0.12); color: #fff; font: inherit;
      }
    </style>
  </head>
  <body>
    <!-- Prototype of the black hole, on its own page (/blackhole.html): not linked from the app yet -->
    <canvas id="c" touch-action="none"></canvas>
    <div id="hud">
      <div><b>Стрілець A*</b> · <span id="fps">–</span> fps · <span id="res"></span></div>
      <button id="doppler">Доплер: вимк</button><button id="ring">Кільце: увімк</button><button id="bloom">Сяйво: увімк</button><button id="quality">Якість</button>
    </div>
    <script type="module" src="/src/blackhole/proto.ts"></script>
  </body>
</html>
