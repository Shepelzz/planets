      - "Апарат «Гюйгенс» сів на Титан і сфотографував його поверхню. Це найдальша посадка, яку колись робили люди!"
      - "Незабаром до Титана полетить літальний робот-дрон «Дрегонфлай», щоб літати від одного місця до іншого."
      - "Через оранжеву димку поверхню Титана з космосу майже не видно."

  uranus:
    name: "Уран"
    name_of: "Урана"   # «Супутники …»
    kind: "Планета, що лежить на боці"
    intro: "Знайомся з Ураном — блакитною планетою, яка ніби котиться на боці! Через такий нахил там бувають дуже незвичні пори дня й ночі. А ще Уран — один із найхолодніших світів Сонячної системи."
    stats:
      diameter:
        label: "Діаметр"
        value: "50 724 км"
        say: "Уран учетверо ширший за Землю. Він блакитний, як велика крижана кулька!"
      distance:
        label: "Від Сонця"
        value: "2,9 млрд км"
        say: "Уран дуже-дуже далеко: у дев’ятнадцять разів далі від Сонця, ніж Земля. Сонце звідти здається зовсім маленьким."
      day_year:
        label: "Доба і рік"
        value: "доба — близько 17 годин\nрік — 84 роки"
        say: "Доба на Урані триває близько сімнадцяти годин. Але Уран лежить на боці, тому день і ніч там бувають дуже дивними! Уран облітає Сонце за вісімдесят чотири роки. Це майже як усе життя бабусі чи дідуся!"
      moons:
        label: "Супутники"
        value: "майже 30"
        say: "В Урана майже тридцять супутників! Багато з них названі на честь казкових героїв: Титанія, Оберон, Міранда."
      temperature:
        label: "Температура"
        value: "до −224 °C"
        say: "Уран — найхолодніша планета! Там буває до мінус двохсот двадцяти чотирьох градусів!"
      inside:
        label: "З чого складається"
        value: "атмосфера, «льоди», ядро"
    compare: "Уран приблизно вчетверо ширший за Землю."
    inside:
      intro: "Зазирнімо всередину Урана!"
      layers:
        atmosphere:
          name: "Атмосфера"
          say: "Зверху — холодна атмосфера з водню, гелію й метану. Саме метан робить Уран блакитним."
        mantle:
          name: "Мантія з «льодів»"
          say: "Під нею — густа гаряча суміш води, аміаку й метану. Учені називають її льодами, хоча вона зовсім не схожа на лід у морозилці!"
        core:
          name: "Ядро"
          say: "А в центрі — невелике кам’яне ядро."
    facts:
      - "Вісь Урана нахилена майже набік, тому планета ніби котиться навколо Сонця, а її полюси десятиліттями отримують незвичне освітлення."
      - "В Урана найхолодніша атмосфера серед усіх планет."
      - "Блакитним Уран робить газ метан."
      - "На полюсі Урана Сонце не заходить 42 роки поспіль, а потім 42 роки триває ніч!"
      - "Супутники Урана назвали на честь героїв казок і п’єс: Титанія, Оберон, Міранда."
      - "Уран — перша планета, яку знайшли в телескоп. До того люди знали лише ті планети, що видно просто на небі."
      - "Нептун далі від Сонця, але Уран холодніший: усередині Урана майже немає власного тепла."
      - "В Урана теж є кільця — тонкі й темні."

  neptune:
    name: "Нептун"
    name_of: "Нептуна"   # «Супутники …»
    kind: "Найдальша планета"
    intro: "Це Нептун — найдальша від Сонця планета! Він темно-синій, крижаний і відомий шаленими вітрами. Уяви: вони можуть розганятися швидше за реактивний літак."
    stats:
