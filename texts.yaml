# Усі тексти застосунку «Подорож до планет» — єдине джерело.
# Правки й коментарі для Claude пиши прямо тут: рядок, що починається з #, або # у кінці рядка.
# Тексти — завжди в подвійних лапках. Ідентифікатори (diameter, crust …) не чіпай.
#   intro   — звучить, коли обираєш тіло
#   stats   — блоки картки: label (назва), value (на картці; \n = новий рядок), say (каже голос)
#             блок inside відкриває розріз, тому say у нього немає
#   compare — фраза під порівнянням із Землею
#   inside  — розріз: intro і шари зверху донизу (name — підпис, say — розповідь)
#   facts   — «А ти знаєш?»

bodies:

  sun:
    name: "Сонце"
    kind: "Наша зоря"
    intro: "Сонце — наша зоря! Воно в самому центрі, і всі планети кружляють навколо нього."
    stats:
      diameter:
        label: "Діаметр"
        value: "1 392 000 км"
        say: "Сонце величезне! Якщо поставити в ряд сто дев’ять таких планет, як Земля, якраз вийде поперек Сонця."
      temperature:
        label: "Температура поверхні"
        value: "близько 5 500 °C"
        say: "На Сонці дуже-дуже спекотно — близько п’яти з половиною тисяч градусів! Це набагато гарячіше за найгарячіше багаття. Навіть залізо там одразу б розплавилося!"
      age:
        label: "Вік"
        value: "4,6 мільярда років"
        say: "Сонцю понад чотири мільярди років! Це так давно, що тоді ще не було ні людей, ні динозаврів, ні навіть нашої Землі."
      inside:
        label: "З чого складається"
        value: "водень і гелій"
      light:
        label: "Світло до Землі летить"
        value: "8 хвилин"
        say: "Сонячний промінчик летить до Землі лише вісім хвилин — приблизно як один коротенький мультик! А машиною туди довелося б їхати понад сто років."
    compare: "Сонце більше за Землю в сто дев’ять разів! Земля поруч із ним — як горошинка біля великого надувного м’яча."
    inside:
      intro: "Сонце не тверде — воно складається з газів, водню й гелію. Зазирнімо всередину!"
      layers:
        convection:
          name: "Кипляча зона"
          say: "Зверху гарячий газ кипить: піднімається й опускається, як суп у каструлі."
        radiation:
          name: "Зона випромінювання"
          say: "Глибше світло пробирається назовні дуже-дуже довго — сотні тисяч років!"
        core:
          name: "Ядро"
          say: "А в центрі — ядро. Це найгарячіше місце: тут народжуються сонячне світло й тепло!"
    facts:
      - "Сонце — це зоря! Величезна куля розжареного газу, яка світить і гріє всі планети."
      - "Усередину Сонця помістилося б понад мільйон таких планет, як Земля."
      - "Світлу від Сонця потрібно лише 8 хвилин, щоб долетіти до Землі."
      - "Усі планети кружляють навколо Сонця, наче на каруселі."
      - "Ніколи не дивись на справжнє Сонце — це небезпечно для очей!"

  mercury:
    name: "Меркурій"
    name_of: "Меркурія"   # «Супутники …»
    kind: "Найменша й найближча до Сонця"
    intro: "Меркурій — перша планета від Сонця. Він найменший і найшвидший!"
    stats:
      diameter:
        label: "Діаметр"
        value: "4 879 км"
        say: "Меркурій — найменша планета! Він зовсім трішки більший за наш Місяць."
      distance:
        label: "Від Сонця"
        value: "58 млн км"
        say: "Меркурій ближче за всіх до Сонця! Тому Сонце на його небі здається майже втричі більшим, ніж у нас."
      day_year:
        label: "Доба і рік"
        value: "доба — 176 днів\nрік — 88 днів"
        say: "Доба на Меркурії дуже довга! Сонячний день там триває цілих три місяці, а потім три місяці триває ніч. Меркурій найшвидше бігає навколо Сонця: одне коло — лише вісімдесят вісім днів! Якби ми жили на Меркурії, день народження святкували б чотири рази на рік!"
      moons:
        label: "Супутники"
        value: "немає"
        say: "У Меркурія немає жодного супутника. Уночі на його небі немає місяця — тільки зірочки."
      temperature:
        label: "Температура"
        value: "від −180 до +430 °C"
        say: "Удень на Меркурії так спекотно, що розплавився б метал, а вночі мороз сильніший, ніж у будь-якій морозилці! А все тому, що там немає повітря, яке вкривало б планету, як ковдра."
      inside:
        label: "З чого складається"
        value: "кора, мантія, залізне ядро"
    compare: "Меркурій майже втричі менший за Землю."
    inside:
      intro: "Зазирнімо всередину Меркурія!"
      layers:
        crust:
          name: "Кора"
          say: "Зверху — тонка кам’яна кора, вся в кратерах."
        mantle:
          name: "Мантія"
          say: "Під нею — кам’яна мантія. Вона зовсім тоненька."
        core:
          name: "Залізне ядро"
          say: "А майже весь Меркурій усередині — це величезне залізне ядро! Воно займає більшу частину планети."
    facts:
      - "Рік на Меркурії коротший за добу: навколо Сонця він пролітає за 88 днів, а від світанку до світанку минає 176 днів."
      - "Меркурій увесь укритий кратерами — ямами від ударів метеоритів, зовсім як Місяць."
      - "Удень там спекотніше, ніж у духовці, а вночі холодніше, ніж у морозилці: у Меркурія немає повітря, щоб тримати тепло."
      - "Меркурій — найшвидша планета, він мчить навколо Сонця швидше за всіх."

  venus:
    name: "Венера"
    name_of: "Венери"   # «Супутники …»
    kind: "Найгарячіша планета"
    intro: "Венера — друга планета від Сонця. Це найгарячіша планета!"
    stats:
      diameter:
        label: "Діаметр"
        value: "12 104 км"
        say: "Венера майже такого самого розміру, як Земля, — зовсім трішки менша. Тому її називають сестричкою Землі!"
      distance:
        label: "Від Сонця"
        value: "108 млн км"
        say: "Венера — друга планета від Сонця. Вона підлітає до Землі ближче за всі інші планети, і ввечері її видно як найяскравішу зірочку!"
      day_year:
        label: "Доба і рік"
        value: "доба — 117 днів\nрік — 225 днів"
        say: "Венера крутиться дуже-дуже повільно. Від одного світанку до іншого там минає сто сімнадцять наших днів — це майже чотири місяці! Венера облітає Сонце за двісті двадцять п’ять днів. Це менше, ніж наш рік."
      moons:
        label: "Супутники"
        value: "немає"
        say: "У Венери немає супутників — вона літає навколо Сонця зовсім сама."
      temperature:
        label: "Температура"
        value: "близько +465 °C"
        say: "Венера — найгарячіша планета, навіть гарячіша за Меркурій! Товсті хмари тримають тепло, як ковдра, і там спекотніше, ніж у печі, де печуть піцу!"
      inside:
        label: "З чого складається"
        value: "кора, мантія, залізне ядро"
    compare: "Венера майже така сама, як Земля, — зовсім трішки менша."
    inside:
      intro: "Зазирнімо всередину Венери!"
      layers:
        crust:
          name: "Кора"
          say: "Зверху — кам’яна кора з вулканами й широкими рівнинами."
        mantle:
          name: "Мантія"
          say: "Під нею — гаряча кам’яна мантія."
        core:
          name: "Залізне ядро"
          say: "А в центрі — залізне ядро. Усередині Венера дуже схожа на нашу планету!"
    facts:
      - "Венера обертається у зворотний бік — Сонце там сходить на заході, а сідає на сході."
      - "Її вкривають товсті хмари, які тримають тепло, як ковдра, тому на Венері спекотніше навіть, ніж на Меркурії."
      - "З Землі Венеру видно як дуже яскраву зірку. Її називають Вечірньою зорею."
      - "За розміром Венера майже як Земля — тому їх називають планетами-сестрами."

  earth:
    name: "Земля"
    name_of: "Землі"   # «Супутники …»
    kind: "Наш дім"
    intro: "Земля — третя планета від Сонця. Це наш дім, тут живемо ми!"
    stats:
      diameter:
        label: "Діаметр"
        value: "12 742 км"
        say: "Земля дуже велика! Якби можна було об’їхати її навколо машиною, дорога тривала б понад два тижні без зупинок!"
      distance:
        label: "Від Сонця"
        value: "150 млн км"
        say: "Земля не надто близько і не надто далеко від Сонця — якраз так, щоб було не дуже спекотно і не дуже холодно. Тому в нас є вода, рослини, звірі й люди!"
      day_year:
        label: "Доба і рік"
        value: "доба — 24 години\nрік — 365 днів"
        say: "Земля обертається навколо себе за двадцять чотири години. Коли наш бік Землі дивиться на Сонце — у нас день, а коли відвертається — настає ніч. За один рік Земля робить одне велике коло навколо Сонця. Поки вона летить, змінюються зима, весна, літо й осінь. А коли коло закінчиться — у тебе знову день народження!"
      moons:
        label: "Супутники"
        value: "1 — Місяць"
        say: "У Землі один супутник — Місяць! Він кружляє навколо Землі й світить нам уночі."
      temperature:
        label: "Температура"
        value: "від −89 до +57 °C"
        say: "На Землі буває і дуже холодно, і дуже спекотно! Найсильніший мороз був в Антарктиді, де живуть пінгвіни, — мінус вісімдесят дев’ять градусів. А найсильніша спека була в пустелі — плюс п’ятдесят сім."
      inside:
        label: "З чого складається"
        value: "кора, мантія, два ядра"
    compare: "Це наша Земля — наш дім!"
    inside:
      intro: "Давай розріжемо нашу планету й зазирнемо всередину! Вона складається з шарів, як цибулинка."
      layers:
        crust:
          name: "Кора"
          say: "Зверху — кора. Це тверда кам’яна шкаринка, на якій ростуть ліси, стоять міста й плещуться океани. Вона тоненька, як шкірка на яблуці!"
        mantle:
          name: "Мантія"
          say: "Під корою — мантія. Це дуже гаряче каміння, яке повільно-повільно тече, як густа-прегуста карамель."
        outer_core:
          name: "Зовнішнє ядро"
          say: "Далі — зовнішнє ядро з рідкого розпеченого заліза. Воно рухається і робить нашу планету великим магнітом — тому й працює компас!"
        inner_core:
          name: "Внутрішнє ядро"
          say: "А в самому центрі — внутрішнє ядро: тверда залізна куля, майже така гаряча, як поверхня Сонця!"
    facts:
      - "Земля — єдина відома планета, де є життя: люди, тварини й рослини."
      - "Понад дві третини Землі вкрито водою — тому з космосу вона блакитна."
      - "Земля мчить навколо Сонця зі швидкістю 30 кілометрів на секунду!"
      - "Повітря захищає нас від маленьких метеоритів: вони згоряють і стають «падаючими зірками»."
      - "Уночі з космосу видно вогники міст."

  moon:
    name: "Місяць"
    kind: "Супутник Землі"
    intro: "Місяць — супутник нашої планети. Він кружляє навколо неї і світить нам уночі."
    stats:
      diameter:
        label: "Діаметр"
        value: "3 474 км"
        say: "Місяць майже вчетверо менший за Землю. Якби Земля була футбольним м’ячем, Місяць був би як тенісний м’ячик!"
      distance:
        label: "Від Землі"
        value: "384 400 км\nоблітає її за 27 днів"
        say: "До Місяця дуже далеко: машиною довелося б їхати без зупинок понад п’ять місяців! А космонавти долітали туди ракетою за три дні. Місяць облітає навколо Землі майже за місяць. Тому щоночі він виглядає по-різному: то круглий, то половинка, то тоненький серпик!"
      weight:
        label: "Вага на Місяці"
        value: "у 6 разів менша"
        say: "На Місяці все важить ушестеро менше, ніж на Землі! Там кожен стає таким легеньким, що може стрибнути вище за дорослу людину!"
      temperature:
        label: "Температура"
        value: "від −170 до +120 °C"
        say: "На Місяці немає повітря. Тому на сонці там спекотніше, ніж у лазні, а в тіні — мороз сильніший, ніж в Антарктиді!"
      visited:
        label: "Там побували"
        value: "12 людей"
        say: "На Місяці побували дванадцять людей — астронавти! Вони гуляли, стрибали, збирали камінці й навіть каталися Місяцем на спеціальній машині."
      inside:
        label: "З чого складається"
        value: "кора, мантія, ядро"
    compare: "Місяць майже вчетверо менший за Землю."
    inside:
      intro: "Зазирнімо всередину Місяця!"
      layers:
        crust:
          name: "Кора"
          say: "Зверху — кам’яна кора, вкрита пилом і кратерами."
        mantle:
          name: "Мантія"
          say: "Під нею — товста кам’яна мантія. Вона давно охолола, тому на Місяці більше немає вулканів."
        core:
          name: "Ядро"
          say: "А в центрі — маленьке залізне ядро."
    facts:
      - "Місяць завжди повернутий до Землі одним і тим самим боком."
      - "На Місяці можна стрибнути в 6 разів вище, ніж на Землі!"
      - "Сліди астронавтів на Місяці збережуться мільйони років — там немає вітру, який би їх здув."
      - "Місяць не світить сам — він відбиває світло Сонця, як дзеркало."
      - "Темні плями на Місяці — це застигла давня лава. Їх називають морями, хоча води там немає."

  mars:
    name: "Марс"
    name_of: "Марса"   # «Супутники …»
    kind: "Червона планета"
    intro: "Марс — четверта планета від Сонця. Його називають Червоною планетою!"
    stats:
      diameter:
        label: "Діаметр"
        value: "6 779 км"
        say: "Марс удвічі менший за Землю. Він маленький, але на ньому є найвища гора в Сонячній системі!"
      distance:
        label: "Від Сонця"
        value: "228 млн км"
        say: "Марс далі від Сонця, ніж Земля. Тому там холодніше, а Сонце на небі здається меншим."
      day_year:
        label: "Доба і рік"
        value: "доба — 24 години 37 хвилин\nрік — 687 днів"
        say: "Доба на Марсі майже як у нас — лише на тридцять сім хвилин довша! Там можна було б спати й снідати майже як удома. Марс облітає Сонце майже за два наші роки. Отже, день народження на Марсі був би вдвічі рідше!"
      moons:
        label: "Супутники"
        value: "2 — Фобос і Деймос"
        say: "У Марса два маленькі супутники — Фобос і Деймос. Вони не круглі, а схожі на великі картоплини!"
      temperature:
        label: "Температура"
        value: "у середньому −60 °C"
        say: "На Марсі дуже холодно — у середньому мінус шістдесят градусів! Це набагато холодніше, ніж у морозилці."
      inside:
        label: "З чого складається"
        value: "кора, мантія, ядро"
    compare: "Марс приблизно вдвічі менший за Землю."
    inside:
      intro: "Зазирнімо всередину Марса!"
      layers:
        crust:
          name: "Кора"
          say: "Зверху — кора з червоного, іржавого каміння."
        mantle:
          name: "Мантія"
          say: "Під нею — кам’яна мантія. Колись вона була дуже гарячою, і на Марсі вивергалися величезні вулкани."
        core:
          name: "Ядро"
          say: "А в центрі — ядро із заліза й сірки."
    facts:
      - "Марс червоний, бо його пісок і каміння вкриті іржею."
      - "На Марсі є найвища гора в Сонячній системі — вулкан Олімп. Він майже в 2,5 раза вищий за Еверест."
      - "Марсом їздять роботи-марсоходи й надсилають нам фотографії."
      - "Захід сонця на Марсі блакитний, а вдень небо там рудувате."
      - "Доба на Марсі майже така сама, як на Землі, — лише на 37 хвилин довша."

  jupiter:
    name: "Юпітер"
    name_of: "Юпітера"   # «Супутники …»
    kind: "Найбільша планета"
    intro: "Юпітер — п’ята планета від Сонця. Це найбільша планета, справжній велетень!"
    stats:
      diameter:
        label: "Діаметр"
        value: "139 820 км"
        say: "Юпітер — справжній велетень! Якщо поставити Землі в ряд, поперек Юпітера їх поміститься одинадцять штук!"
      distance:
        label: "Від Сонця"
        value: "778 млн км"
        say: "Юпітер уп’ятеро далі від Сонця, ніж Земля. Тому там холодно, а Сонце здається маленьким."
      day_year:
        label: "Доба і рік"
        value: "доба — близько 10 годин\nрік — майже 12 років"
        say: "Юпітер крутиться дуже швидко: доба там триває лише десять годин! Не встигнеш озирнутися — а вже знову вечір! Юпітер облітає Сонце майже за дванадцять років. Поки він зробить одне коло, ти встигнеш вирости й майже закінчити школу!"
      moons:
        label: "Супутники"
        value: "понад 90"
        say: "У Юпітера понад дев’яносто супутників! Чотири найбільші можна побачити з Землі навіть у звичайний бінокль."
      temperature:
        label: "Температура"
        value: "близько −110 °C"
        say: "На Юпітері дуже холодно — близько мінус ста десяти градусів. І стати там ніде: у Юпітера немає землі, тільки хмари й газ!"
      inside:
        label: "З чого складається"
        value: "хмари, водень, ядро"
    compare: "Юпітер ширший за Землю в одинадцять разів! А всередину нього помістилося б понад тисячу Земель!"
    inside:
      intro: "У Юпітера немає твердої поверхні. Зазирнімо всередину велетня!"
      layers:
        clouds:
          name: "Хмари"
          say: "Зверху — хмари й вітри. Це ті смужки, які видно в телескоп."
        liquid_hydrogen:
          name: "Рідкий водень"
          say: "Глибше газ стискається так сильно, що стає рідким. Це величезний океан рідкого водню!"
        metallic_hydrogen:
          name: "Металевий водень"
          say: "Ще глибше водень стиснутий так сильно, що стає схожим на рідкий метал."
        core:
          name: "Ядро"
          say: "А в самій середині, мабуть, є ядро з каміння й льоду. Учені досі його вивчають!"
    facts:
      - "Усередину Юпітера помістилося б понад 1 300 таких планет, як Земля."
      - "Велика Червона Пляма — це ураган, більший за всю Землю. Він крутиться вже сотні років!"
      - "У Юпітера немає твердої поверхні — він складається з газу, на нього не можна стати."
      - "Юпітер крутиться швидше за всі планети: доба там триває лише 10 годин."
      - "У Юпітера теж є кільця, тільки дуже тонкі й темні — їх майже не видно."

  saturn:
    name: "Сатурн"
