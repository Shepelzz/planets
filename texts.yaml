      - "Апарат «Кассіні» пролетів крізь фонтани Енцелада й «скуштував» їх: у них є сіль і речовини, потрібні для життя."
      - "Сніг на Енцеладі падає з його ж фонтанів."

  titan:
    name: "Титан"
    kind: "Найбільший супутник Сатурна"
    intro: "Це Титан — найбільший супутник Сатурна, укритий густою оранжевою димкою. На ньому є річки, озера й дощі — тільки не з води!"
    stats:
      diameter:
        label: "Діаметр"
        value: "5 150 км"
        say: "Титан — другий за розміром супутник у Сонячній системі. Він більший за планету Меркурій!"
      distance:
        label: "Від Сатурна"
        value: "1 220 000 км\nколо за 16 діб"
        say: "Титан облітає Сатурн за шістнадцять днів."
      air:
        label: "Повітря"
        value: "густіше, ніж у нас"
        say: "Повітря на Титані таке густе, а сила тяжіння така слабка, що людина з крилами на руках могла б там літати, як птах!"
      lakes:
        label: "Озера й дощі"
        value: "з рідкого газу"
        say: "На Титані йдуть дощі, течуть річки й хлюпочуть озера — тільки не з води, а з рідкого газу метану, бо там дуже холодно."
      temperature:
        label: "Температура"
        value: "близько −180 °C"
        say: "На Титані дуже холодно — близько мінус ста вісімдесяти градусів."
      inside:
        label: "З чого складається"
        value: "лід, океан, лід і каміння"
    compare: "Титан приблизно вдвічі з половиною вужчий за Землю і більший за Меркурій."
    inside:
      intro: "Зазирнімо всередину Титана!"
      layers:
        crust:
          name: "Крижана кора"
