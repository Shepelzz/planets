          say: "Зверху — синя атмосфера з водню, гелію й метану, де дмуть найсильніші вітри."
        mantle:
          name: "Мантія з «льодів»"
          say: "Під нею — густа гаряча суміш води, аміаку й метану. Можливо, там навіть падає дощ із діамантів!"
        core:
          name: "Ядро"
          say: "А в центрі — кам’яне ядро, завбільшки приблизно як наша планета."
    facts:
      - "На Нептуні дмуть найсильніші вітри в Сонячній системі — понад 2 000 км на годину!"
      - "Нептун спочатку знайшли на папері: учені обчислили, де він має бути, і тільки потім побачили його в телескоп."
      - "Відтоді як Нептун відкрили у 1846 році, він облетів Сонце лише один раз."
