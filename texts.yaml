        say: "Сатурн теж велетень: поперек нього вміститься дев’ять Земель! А якщо рахувати разом із кільцями — понад двадцять!"
      distance:
        label: "Від Сонця"
        value: "1,4 млрд км"
        say: "Сатурн майже вдесятеро далі від Сонця, ніж Земля. Космічні апарати летять туди кілька років!"
      day_year:
        label: "Доба і рік"
        value: "доба — близько 10,5 години\nрік — майже 30 років"
        say: "Сатурн крутиться майже так само швидко, як Юпітер: доба там триває лише десять з половиною годин. Одне коло навколо Сонця Сатурн робить майже тридцять років. За цей час діти встигли б вирости й стати дорослими!"
      moons:
        label: "Супутники"
        value: "понад 270"
        say: "У Сатурна найбільше супутників — понад двісті сімдесят! А найбільший, Титан, навіть більший за планету Меркурій!"
      temperature:
        label: "Температура"
        value: "близько −140 °C"
        say: "На Сатурні дуже холодно — близько мінус ста сорока градусів. А його гарні кільця зроблені з льоду й каміння!"
      inside:
        label: "З чого складається"
        value: "хмари, водень, ядро"
    compare: "Сатурн ширший за Землю в дев’ять разів!"
    inside:
      intro: "Зазирнімо всередину Сатурна!"
      layers:
        clouds:
          name: "Хмари"
          say: "Зверху — хмари з жовтуватими смугами."
        liquid_hydrogen:
          name: "Рідкий водень"
          say: "Під хмарами — океан рідкого водню."
        metallic_hydrogen:
          name: "Металевий водень"
          say: "Глибше водень стиснутий так сильно, що стає схожим на рідкий метал."
        core:
          name: "Ядро"
          say: "А в центрі — ядро з каміння й льоду."
    facts:
      - "Кільця Сатурна складаються з мільярдів шматочків льоду й каміння — від піщинки до розміру будинку."
      - "Сатурн такий легкий, що міг би плавати у величезній-превеличезній ванні з водою."
      - "У Сатурна найбільше супутників у Сонячній системі."
      - "Кільця величезні завширшки, але дуже тонкі — місцями лише близько 10 метрів."
      - "На найбільшому супутнику Сатурна, Титані, є озера — тільки не з води, а з рідкого газу."

  uranus:
    name: "Уран"
    name_of: "Урана"   # «Супутники …»
    kind: "Планета, що лежить на боці"
    intro: "Уран — сьома планета від Сонця. Він блакитний і лежить на боці!"
    stats:
      diameter:
        label: "Діаметр"
        value: "50 724 км"
        say: "Уран учетверо ширший за Землю. Він блакитний, як велика крижана кулька!"
      distance:
        label: "Від Сонця"
        value: "2,9 млрд км"
        say: "Уран дуже-дуже далеко: у дев’ятнадцять разів далі від Сонця, ніж Земля. Сонце звідти здається зовсім маленьким."
      day_year:
        label: "Доба і рік"
        value: "доба — близько 17 годин\nрік — 84 роки"
        say: "Доба на Урані триває близько сімнадцяти годин. Але Уран лежить на боці, тому день і ніч там бувають дуже дивними! Уран облітає Сонце за вісімдесят чотири роки. Це майже як усе життя бабусі чи дідуся!"
      moons:
        label: "Супутники"
        value: "майже 30"
        say: "В Урана майже тридцять супутників! Багато з них названі на честь казкових героїв: Титанія, Оберон, Міранда."
      temperature:
        label: "Температура"
        value: "до −224 °C"
        say: "Уран — найхолодніша планета! Там буває до мінус двохсот двадцяти чотирьох градусів!"
      inside:
        label: "З чого складається"
        value: "атмосфера, «льоди», ядро"
    compare: "Уран учетверо ширший за Землю!"
    inside:
      intro: "Зазирнімо всередину Урана!"
      layers:
        atmosphere:
          name: "Атмосфера"
          say: "Зверху — холодна атмосфера з водню, гелію й метану. Саме метан робить Уран блакитним."
        mantle:
          name: "Мантія з «льодів»"
          say: "Під нею — густа гаряча суміш води, аміаку й метану. Учені називають її льодами, хоча вона зовсім не схожа на лід у морозилці!"
        core:
          name: "Ядро"
          say: "А в центрі — невелике кам’яне ядро."
    facts:
      - "Уран обертається, лежачи на боці, — ніби котиться своєю орбітою, як м’ячик."
      - "В Урана найхолодніша атмосфера серед усіх планет."
      - "Блакитним Уран робить газ метан."
      - "На полюсі Урана Сонце не заходить 42 роки поспіль, а потім 42 роки триває ніч!"
      - "Супутники Урана назвали на честь героїв казок і п’єс: Титанія, Оберон, Міранда."

  neptune:
    name: "Нептун"
