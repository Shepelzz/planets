    facts:
      - "Каллісто майже не змінювався мільярди років — він як космічний музей кратерів."
      - "На Каллісто є величезний кратер Валгалла, оточений кільцями, наче кола на воді від кинутого камінця."
      - "Каллісто далеко від Юпітера, тому там спокійніше й безпечніше, ніж на інших великих супутниках."

  saturn:
    name: "Сатурн"
    name_of: "Сатурна"   # «Супутники …»
    kind: "Планета з кільцями"
    intro: "Це Сатурн — планета з величезними кільцями! Вони складаються з безлічі крижинок і кам’яних уламків. Та Сатурн цікавий не лише кільцями — давай дослідимо його ближче."
    stats:
      diameter:
        label: "Діаметр"
        value: "116 460 км"
        say: "Сатурн теж велетень: поперек нього вміститься дев’ять Земель! А якщо рахувати разом із кільцями — понад двадцять!"
      distance:
        label: "Від Сонця"
        value: "1,4 млрд км"
        say: "Сатурн майже вдесятеро далі від Сонця, ніж Земля. Космічні апарати летять туди кілька років!"
      day_year:
        label: "Доба і рік"
        value: "доба — близько 10,5 години\nрік — майже 30 років"
        say: "Сатурн крутиться майже так само швидко, як Юпітер: доба там триває лише десять з половиною годин. Одне коло навколо Сонця Сатурн робить майже тридцять років. За цей час діти встигли б вирости й стати дорослими!"
      moons:
        label: "Супутники"
        value: "понад 270"
        say: "У Сатурна найбільше супутників — понад двісті сімдесят! А найбільший, Титан, навіть більший за планету Меркурій!"
      temperature:
        label: "Температура"
        value: "близько −140 °C"
        say: "На Сатурні дуже холодно — близько мінус ста сорока градусів. А його гарні кільця зроблені з льоду й каміння!"
      inside:
        label: "З чого складається"
        value: "хмари, водень, ядро"
    compare: "Сатурн приблизно в дев’ять разів ширший за Землю — і ще має гігантську систему кілець."
    inside:
      intro: "Зазирнімо всередину Сатурна!"
      layers:
        clouds:
          name: "Хмари"
          say: "Зверху — хмари з жовтуватими смугами."
        liquid_hydrogen:
          name: "Рідкий водень"
          say: "Під хмарами — океан рідкого водню."
        metallic_hydrogen:
          name: "Металевий водень"
          say: "Глибше водень стиснутий так сильно, що стає схожим на рідкий метал."
        core:
          name: "Ядро"
          say: "А в центрі — ядро з каміння й льоду."
    facts:
      - "Кільця Сатурна складаються з мільярдів шматочків льоду й каміння — від піщинки до розміру будинку."
      - "Середня густина Сатурна менша за густину води. Якби існувала неймовірно велика ванна, у якій вистачило б місця для планети, Сатурн міг би плавати!"
      - "У Сатурна найбільше супутників у Сонячній системі."
      - "Кільця величезні завширшки, але дуже тонкі — місцями лише близько 10 метрів."
      - "На найбільшому супутнику Сатурна, Титані, є озера — тільки не з води, а з рідкого метану. Це той самий газ, що горить у кухонній плиті!"
      - "На північному полюсі Сатурна крутиться величезний шторм у формі шестикутника — як комірка бджолиного стільника!"

  enceladus:
