        say: "Тритон — єдиний великий супутник, що кружляє навпаки. Мабуть, колись він був окремою карликовою планетою, як Плутон, а Нептун його зловив."
      temperature:
        label: "Температура"
        value: "близько −235 °C"
        say: "Тритон — одне з найхолодніших місць у Сонячній системі: там близько мінус двохсот тридцяти п’яти градусів!"
      inside:
        label: "З чого складається"
        value: "лід, лід, кам’яне ядро"
    compare: "Тритон приблизно вп’ятеро вужчий за Землю."
    inside:
      intro: "Зазирнімо всередину Тритона!"
      layers:
        crust:
          name: "Крижана кора"
          say: "Зверху — кора із замерзлого газу азоту, рожевувата й блискуча."
        mantle:
          name: "Шар льоду"
          say: "Під нею — товстий шар водяного льоду."
        core:
          name: "Кам’яне ядро"
          say: "А в центрі — кам’яне ядро."
    facts:
      - "На Тритоні б’ють гейзери з азоту, що злітають на вісім кілометрів угору."
      - "Частина поверхні Тритона схожа на шкірку дині, тому її так і називають — «динна» місцевість."
      - "Тритон повільно наближається до Нептуна. Через дуже-дуже багато років Нептун розірве його, і навколо Нептуна з’явиться кільце."

  pluto:
    name: "Плутон"
    name_of: "Плутона"   # «Супутники …»
    kind: "Карликова планета"
    intro: "Далеко за Нептуном мандрує Плутон — карликова планета з крижаною поверхнею. Колись його вважали дев’ятою планетою Сонячної системи."
    stats:
      diameter:
        label: "Діаметр"
        value: "2 377 км"
        say: "Плутон зовсім маленький — менший навіть за наш Місяць! Тому його й назвали карликовою планетою."
      distance:
        label: "Від Сонця"
        value: "5,9 млрд км"
        say: "Плутон дуже-дуже далеко — майже в сорок разів далі від Сонця, ніж наша планета. Сонце звідти схоже на дуже яскраву зірку."
      day_year:
        label: "Доба і рік"
