  say:
    hint: "Обери зорю, а потім додай планети. Кожну планету можна потягнути пальцем — ближче до зорі чи далі — і подивитися, що з нею станеться!"
    zone: "Зелене кільце — це зона життя. Тут не надто спекотно й не надто холодно, і вода може бути рідкою, як у наших морях. Саме там може з’явитися життя!"
    star_red: "Червоний карлик — маленька зоря, яка світить слабенько й червонувато. Зате вона живе неймовірно довго — довше за всі інші зорі! Щоб зігрітися біля неї, планета мусить кружляти зовсім близько."
    star_sun: "Ця зоря — як наше Сонце: жовта, тепла й спокійна. Біля неї зона життя там само, де в нас Земля."
    star_white: "Біла зоря вдвічі важча за Сонце й світить набагато яскравіше. Тому її зона життя далі — тепла вистачає й там."
    star_blue: "Блакитний велетень — величезна, страшенно гаряча й яскрава зоря. Вона світить у тисячі разів яскравіше за Сонце, тому зона життя біля неї дуже-дуже далеко."
    type_rocky: "Кам’яна планета — як Земля, Марс чи Венера. У неї тверда поверхня, по ній можна ходити. Подивись: біля зорі вона розпечена, у зоні життя на ній є моря, а далеко — вона вкривається кригою."
    type_ice: "Крижаний велетень — як Уран і Нептун. Він великий, холодний і блакитний, а всередині в нього багато льоду й води."
    type_gas: "Газовий велетень — як Юпітер і Сатурн. Він величезний і майже весь складається з газу, тому твердої землі в нього немає."
    size_small: "Маленька планета — як Марс. Тяжіння на ній слабше, тому на ній легко стрибати високо-високо."
    size_medium: "Планета завбільшки з Землю. Тяжіння на ній таке саме, як удома."
    size_large: "Велика кам’яна планета — більша за Землю. Учені звуть такі планети супер-Землями. Тяжіння на ній сильніше, тож стрибати було б важче."
    year_short: "Рік тут коротший, ніж на Землі: планета близько до зорі й оббігає її швидко. День народження тут був би частіше!"
    year_earth: "Рік тут майже такий, як на Землі."
    year_long: "Рік тут довший, ніж на Землі: планета далеко й іде навколо зорі довго-довго. День народження тут був би рідше."
    temp_scorching: "Тут розпечено — гарячіше, ніж у духовці! Вода тут одразу б википіла."
    temp_hot: "Тут дуже спекотно, гарячіше, ніж у найжаркішій пустелі."
    temp_mild: "Тут тепло, як у нас на Землі! Вода може бути рідкою — і текти річками й хлюпатися в морях."
    temp_cold: "Тут холодно, як найлютішої зими. Вода тут замерзає на лід."
    temp_frozen: "Тут страшенно холодно — усе вкрите кригою, навіть повітря могло б замерзнути!"
    weight_light: "Тяжіння тут слабше, ніж на Землі: тут усе легше, і стрибнути можна набагато вище!"
    weight_earth: "Тяжіння тут майже таке, як на Землі: вага така сама, як удома."
    weight_heavy: "Тут тяжіння сильніше, ніж на Землі: усе важче, і стрибати було б важко."
    weight_gas: "У газового чи крижаного велетня немає твердої землі — стати там ніде, тільки хмари й газ."
    life_yes: "Ура! Тут могло б бути життя: планета кам’яна й тепла, а вода може бути рідкою!"
    life_hot: "Для життя тут надто спекотно. Спробуй відсунути планету далі від зорі — до зеленого кільця."
    life_cold: "Для життя тут надто холодно. Спробуй підсунути планету ближче до зорі — до зеленого кільця."
    life_gas: "На газовому чи крижаному велетні жити ніде — у нього немає твердої поверхні. Для життя потрібна кам’яна планета."
    life_no_air: "Для життя тут замало повітря: немає чим дихати, і вода випаровується в космос. Спробуй дати планеті повітря, як на Землі."
    life_no_water: "Тут тепло й є повітря, але немає води. А без води життя не буває! Додай планеті воду."
    air_none: "Без повітря — як на Місяці. Небо там чорне навіть удень, і нічого не зберігає тепло: удень пече, уночі мороз."
    air_thin: "Тонке повітря — як на Марсі. Його так мало, що дихати ним не можна, і тепло воно майже не тримає."
    air_earth: "Повітря як на Землі: ним можна дихати, воно вкриває планету, ніби теплою ковдрою, і робить небо блакитним."
    air_thick: "Дуже густе повітря — як на Венері. Воно тримає тепло, як найтепліша ковдра, тому під ним страшенно гаряче, гарячіше, ніж біля самої зорі!"
    water_yes: "На планеті є вода. Якщо тепло — вона хлюпочеться в морях і океанах, а якщо холодно — замерзає на лід."
    water_no: "Води на планеті немає — суха кам’яна пустеля."
    rings_yes: "У планети є кільця — мільйони крижинок і камінців, які кружляють навколо неї, як у Сатурна."
    rings_no: "Кілець немає. Але кільця бувають не лише в Сатурна: тоненькі кільця є навіть в Юпітера, Урана й Нептуна!"
    moons_none: "У планети немає супутників — як у Меркурія й Венери."
    moons_some: "У планети є супутники — маленькі світи, які кружляють навколо неї, як Місяць навколо Землі."
    sky_black: "Без повітря небо чорне, навіть коли світить зоря: удень на ньому видно зірки!"
    sky_pink: "З тонким пиловим повітрям небо рожево-руде, як на Марсі. А захід сонця там — блакитний!"
    sky_blue: "Небо блакитне, як у нас: повітря розсіює блакитне світло зорі на все небо."
    sky_orange: "Під густими хмарами небо жовто-помаранчеве і похмуре — як на Венері чи Титані."
    inside_rocky: "Кам’яна планета схожа на яйце: зверху тонка кам’яна кора, як шкаралупа, під нею товста мантія з гарячого каміння, а в центрі — залізне ядро, наче жовток."
    inside_ice: "Крижаний велетень зверху вкритий хмарами й газом, під ними — товстий шар гарячого льоду й води, а в самому центрі — кам’яне ядро."
    inside_gas: "Газовий велетень майже весь із газу. Глибше газ так стискається, що стає рідким, як метал, а в самому центрі — ядро з каменю й льоду."
    paint_hint: "Обери, що малювати, — океан, ліс, пустелю, гори чи лід, — і малюй пальцем просто по планеті. Щоб повернути планету іншим боком, натисни «Крутити»."
    paint_climate: "Твоя карта — як справжня: якщо планета замерзне, моря на ній вкриються кригою, а якщо стане надто спекотно чи зникне повітря — моря висохнуть. Спробуй потягнути планету ближче до зорі чи далі!"
    surf_ocean: "Океан — величезна солона вода. Біля берегів він світліший, бо там мілко, а далі — глибокий і темно-синій."
    surf_forest: "Ліс — дерева й трава. Зверху, з космосу, ліси видно як темно-зелені плями."
    surf_desert: "Пустеля — пісок і каміння, де майже не буває дощу. З космосу вона жовта й руда."
    surf_mountains: "Гори — високі кам’яні хребти. На їхніх верхівках лежить сніг, навіть коли внизу тепло."
    surf_ice: "Лід — замерзла вода. Найбільше криги зазвичай на полюсах, де найхолодніше, — як в Антарктиді."
    two_stars: "Дві зорі кружляють одна навколо одної — навколо спільного центру, як двоє друзів, що тримаються за руки й крутяться. Таких пар у космосі дуже багато! А планети можуть кружляти навколо обох зір одразу — учені вже знайшли такі справжні планети."
    unstable_zone: "Червоне коло — нестійка зона. Тут дві зорі по черзі тягнуть планету то в один бік, то в інший, і зрештою викидають її геть. Планети живуть далі, за червоним колом."
    suns_two: "На цій планеті на небі сяють два сонця! Тут буває два світанки й два заходи сонця, а в кожного предмета — дві тіні."
    life_unstable: "Тут орбіта нестійка: дві зорі розгойдують планету й рано чи пізно викинуть її. Відсунь планету далі, за червоне коло."
    too_close: "Ці дві планети кружляють надто близько одна до одної. Щоразу, коли вони проходять поруч, вони трішки тягнуть одна одну — і зрештою зіткнуться! Натисни «Що буде?», щоб подивитися, або відсунь планети далі."
    moon_closer: "Якщо супутник підлетить до планети надто близько, її тяжіння почне розтягувати його — одним боком сильніше, ніж іншим. Учені називають цю межу межею Роша. Натисни, щоб подивитися, що станеться!"
    molten: "Після зіткнення поверхня планети розплавилася — це море гарячої лави! Подивись: вона поступово остигає, і з’являється нова тверда кора."
    ev_merge: "Бум! Дві кам’яні планети зіткнулися й злилися в одну, більшу. Поверхня розплавилася, частину повітря вибило в космос, а з уламків навколо збирається новий супутник. Учені думають, що саме так колись утворився наш Місяць!"
    ev_swallow: "Газовий велетень такий величезний, що маленька кам’яна планета просто зникла в його хмарах — він її проковтнув і навіть не помітив."
    ev_giants: "Два велетні зіткнулися й злилися в одного, ще більшого. Такі зіткнення бували в молодих зоряних системах."
    ev_ring: "Тяжіння планети розірвало супутник на мільйони шматочків, і вони розсипалися навколо планети кільцем! Можливо, колись так з’являться кільця й у Марса: його супутник Фобос потроху наближається."
    orbit: "Посунь повзунок — і планета полетить ближче до зорі чи далі від неї. Зелена смужка на повзунку — зона життя: там не надто спекотно й не надто холодно."

  # «Мої відкриття»: нагороди за відкриття у власній системі. title — напис на значку, say — що розповідає голос.
  awards:
    first_planet:
      title: "Перша планета"
      say: "Перша планета готова! Так народжуються справжні планети: з пилу й каміння навколо молодої зорі."
    life:
      title: "Світ, де можна жити"
      say: "Відкриття! Кам’яна планета з повітрям і водою в зоні життя — саме такі світи шукають учені, коли шукають життя в космосі."
    red_life:
      title: "Життя біля червоного карлика"
      say: "Планета в зоні життя біля червоного карлика! Такі зорі — найчисленніші в нашій галактиці, і біля них уже знайшли планети, схожі на Землю."
    two_suns:
      title: "Два сонця"
      say: "Планета з двома сонцями, як у казці! Але це правда: учені знайшли справжні планети, що кружляють навколо двох зір одразу."
    rings:
      title: "Планета з кільцями"
      say: "Кільця! Вони складаються з мільйонів крижинок і камінців. Найгарніші — у Сатурна, а тоненькі є ще в трьох планет."
    three_moons:
      title: "Три місяці"
      say: "У планети три супутники! Уяви: уночі на небі одразу три місяці. А в Юпітера й Сатурна супутників понад сотню!"
    gas_giant:
      title: "Газовий велетень"
      say: "Газовий велетень — як Юпітер. Він такий великий, що всередині помістилося б понад тисячу таких планет, як Земля."
    venus:
      title: "Як Венера"
      say: "Розпечена планета під густими хмарами — як Венера! Густе повітря тримає тепло, тому там гарячіше, ніж біля самої зорі."
    frozen:
      title: "Крижаний світ"
      say: "Крижаний світ — холодніший за мінус сто п’ятдесят градусів! Так холодно буває далеко від зорі, як на Плутоні."
    short_year:
      title: "Рік за тиждень"
      say: "Рік коротший за тиждень! Планета мчить навколо зорі зовсім близько. У справжніх планет біля червоних карликів рік триває лише кілька днів."
    long_year:
      title: "Рік на все життя"
      say: "Рік довший за сто наших років! Поки планета зробить одне коло навколо зорі, на Землі мине ціле людське життя."
    painted:
      title: "Мій власний світ"
      say: "Ось і власний світ, намальований твоєю рукою! А справжні карти планет учені складають зі знімків космічних апаратів — шматочок за шматочком."
    unstable:
      title: "Нестійка орбіта"
      say: "Відкриття: біля двох зір не кожна орбіта стійка! Зорі розгойдують планету, і вона не може там довго кружляти. Тепер ти це знаєш, як справжні астрономи."
    collision:
      title: "Зіткнення планет"
      say: "Зіткнення планет! У молодих зоряних системах таке траплялося часто: так планети росли, а з уламків народжувалися супутники."
    moon_ring:
      title: "Кільце зі супутника"
      say: "Супутник, який підлетів надто близько, розсипався на кільце! Деякі вчені думають, що кільця Сатурна теж колись були супутником."
    full:
      title: "Ціла система"
      say: "Шість планет — ціла зоряна система! У нашій Сонячній системі вісім планет, а деякі зорі мають ще більше."

