        ocean:
          name: "Океан"
          say: "Під льодом — глибокий солоний океан. Учені думають, що в ньому навіть може бути життя!"
        mantle:
          name: "Кам’яна мантія"
          say: "Під океаном — кам’яна мантія."
        core:
          name: "Залізне ядро"
          say: "А в центрі — залізне ядро."
    facts:
      - "Європа — одне з найгладкіших тіл у Сонячній системі: на ній майже немає гір."
      - "Руді смуги на Європі — це тріщини в льоду."
      - "До Європи летить космічний апарат «Європа Кліпер», щоб дізнатися, чи може в її океані бути життя."
      - "Іноді з тріщин Європи, мабуть, б’ють фонтани води просто в космос."

  ganymede:
