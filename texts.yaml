    facts:
      - "Харон такий великий поруч із Плутоном, що вони кружляють навколо спільної точки між ними — ніби тримаються за руки й танцюють."
      - "Плутон і Харон завжди дивляться одне на одного одним і тим самим боком."
      - "На півночі Харона є темнувато-руда ділянка, яку неофіційно називають Мордором — на честь місцевості з «Володаря перснів»."
      - "Харона назвали на честь човняра з давньогрецьких міфів, який перевозив мандрівників через річку."
      - "Відкривач Харона, Джеймс Крісті, обрав цю назву ще й тому, що вона схожа на ім’я його дружини — Шарлін."

  comet:
    # Комета: свої блоки (будь-які ключі в stats), без розрізу («inside») і без порівняння із Землею
    name: "Комета"
    kind: "Космічна сніжка з хвостом"
    intro: "Ого, це комета! Велика брудна сніжка з льоду й пилу, яка мандрує навколо Сонця. Коли вона підлітає до Сонця, у неї виростає довжелезний сяючий хвіст!"
    stats:
      what:
        label: "Що це"
        value: "сніжка з льоду, пилу й камінців"
        say: "Комета — це величезна сніжка, змішана з пилом і камінцями. Вчені так і кажуть: брудна сніжка! Вона зліпилася дуже-дуже давно, ще коли народжувалися планети."
      nucleus:
        label: "Ядро"
        value: "кілька кілометрів\nяк ціле місто"
        say: "Тверда серединка комети називається ядром. Вона завбільшки з ціле місто! А ще ядро темне-темне, темніше за вугілля, бо вкрите пилом."
      why_tail:
        label: "Звідки хвіст"
        value: "Сонце розтоплює лід"
        say: "Далеко від Сонця комета — просто темна крижана брила без хвоста. Але коли вона підлітає ближче, Сонце її гріє. Лід перетворюється на газ і разом із пилом вилітає назовні. Так у комети з’являється сяюча голова, а за нею — хвіст!"
      direction:
        label: "Куди дивиться хвіст"
        value: "завжди від Сонця"
        say: "Ось дивина: хвіст комети завжди показує від Сонця! Його відштовхують сонячне світло й сонячний вітер. Тому, коли комета відлітає від Сонця, вона летить хвостом уперед. Подивись на нашу комету!"
      tail:
        label: "Найдовший хвіст"
        value: "570 млн км!"
        say: "Хвости комет бувають неймовірно довгими! У комети Хякутаке хвіст простягнувся на п’ятсот сімдесят мільйонів кілометрів. Це майже вчетверо далі, ніж від Землі до Сонця!"
      path:
        label: "Як літає"
        value: "по довгому витягнутому колу"
        say: "Планети кружляють навколо Сонця майже по колу, а комети — по дуже витягнутому овалу. Вони то підлітають близько до Сонця, то відлітають далеко-далеко, за всі планети. Тому деякі комети ми бачимо лише раз на багато років."
      home:
        label: "Звідки прилітають"
        value: "з далеких країв за Плутоном"
        say: "Комети живуть на самому краю Сонячної системи, далеко за Плутоном. Там їх мільярди! Іноді котрусь штовхає сила тяжіння, і вона вирушає в довгу подорож до Сонця."
    facts:
      - "Слово «комета» означає «волохата зоря». Давні греки думали, що в неї розпущене довге волосся!"
      - "У яскравої комети буває два хвости: блакитний — із газу, і білий — із пилу. Пошукай обидва в нашої комети!"
      - "Найвідоміша комета — комета Галлея. Вона прилітає раз на сімдесят шість років. Наступного разу її можна буде побачити у дві тисячі шістдесят першому році!"
      - "Комету Чурюмова — Герасименко відкрили астрономи з Києва. А потім люди вперше в історії посадили на комету маленький космічний апарат!"
      - "Комета Чурюмова — Герасименко схожа на гумову качечку. А ще вона пахне тухлими яйцями — це з’ясував космічний апарат «Розетта»!"
      - "Коли Земля пролітає крізь пил, який лишила комета, порошинки згоряють у повітрі. Тоді на небі видно зорепад — багато «падаючих зірок». Найкрасивіший буває щороку в серпні!"
      - "Колись люди побачили, як комета врізалася в Юпітер! Юпітер розірвав її на двадцять один шматочок, і вони один за одним упали на планету."
      - "Комета — це не метеор! Метеор — маленький камінчик, який згоряє в повітрі за одну секунду. А комета летить у космосі тижнями й місяцями."

  sagittarius:
    # Чорна діра: свої блоки (будь-які ключі в stats), без розрізу й без порівняння із Землею.
    # Тексти без страшного: діра далеко, спокійна, нікого не «ловить».
    name: "Стрілець A*"
    kind: "Чорна діра в центрі галактики"
    intro: "Ми в самому центрі нашої галактики! Ось Стрілець А-зірочка — величезна чорна діра. Подивись, як навколо неї кружляє сяючий гарячий газ, а світло вигинається й малює кільце!"
    stats:
      what:
        label: "Що це"
        value: "місце найсильнішого тяжіння"
        say: "Чорна діра — це місце в космосі, де тяжіння дуже-дуже сильне. Навіть світло, якщо підлетить зовсім близько, не може звідти вибратися. Тому вона й чорна!"
      where:
        label: "Де"
        value: "у центрі нашої галактики"
        say: "Наша галактика, Чумацький Шлях, — це величезне колесо із сотень мільярдів зірок. А в самій його середині живе Стрілець А-зірочка."
      distance:
        label: "Від Землі"
        value: "26 000 світлових років"
        say: "Вона дуже-дуже далеко: світло летить звідти до нас двадцять шість тисяч років! Ми живемо на тихій околиці галактики, а вона — у самому її центрі."
      mass:
        label: "Важить"
        value: "як 4 мільйони Сонць"
        say: "Ця чорна діра важить як чотири мільйони таких зірок, як наше Сонце! Тому її й називають надмасивною — тобто дуже-дуже важкою."
      size:
        label: "Розмір"
        value: "близько 25 млн км"
        say: "Чорна куля Стрільця А-зірочки ширша за наше Сонце приблизно у вісімнадцять разів. Але для такої ваги це зовсім мало — уся ця вага стиснута дуже тісно."
      ring:
        label: "Сяюче кільце"
        value: "гарячий газ навколо"
        say: "Навколо чорної діри кружляє газ. Він мчить так швидко, що розжарюється й світиться. А тяжіння вигинає світло, тому ми бачимо кільце і зверху, і знизу — як на цій картинці!"
      photo:
        label: "Перше фото"
        value: "2022 рік"
        say: "У дві тисячі двадцять другому році вчені вперше її сфотографували! Телескопи з різних куточків Землі працювали разом, наче один великий телескоп завбільшки з цілу планету. На фото — помаранчеве кільце навколо темної плями."
    facts:
      - "Чорні діри не засмоктують усе підряд. Якби замість Сонця раптом опинилася чорна діра такої ж ваги, планети кружляли б навколо неї так само, як зараз."
      - "Навколо Стрільця А-зірочки кружляють зорі. Одна з них, зоря S2, робить повне коло за шістнадцять років."
      - "Вчені тридцять років стежили, як зорі в центрі галактики кружляють навколо невидимої точки. Так вони знайшли цю чорну діру й отримали за це Нобелівську премію."
      - "Наше Сонце разом з усіма планетами теж мандрує навколо центру галактики. Одне таке коло триває двісті тридцять мільйонів років!"
      - "Стрілець А-зірочка дуже тиха й спокійна: газу навколо неї мало, тому насправді вона світиться слабенько."
      - "Таку картинку чорної діри, як тут, уперше намалювали для фільму «Інтерстеллар» — за справжніми формулами вчених. Ми теж рахуємо, як вигинається світло, для кожної крапочки на екрані!"
      - "Назва «Стрілець» — це сузір’я, у тому боці неба її шукають астрономи. А зірочкою вчені позначили особливе місце, яке дуже яскраво «світиться» для радіотелескопів."

