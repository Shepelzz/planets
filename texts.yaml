        say: "Каллісто — найдальший із чотирьох великих супутників Юпітера. Він облітає Юпітер за сімнадцять днів."
      craters:
        label: "Кратери"
        value: "найбільше в Сонячній системі"
        say: "На Каллісто так багато кратерів, що між ними майже немає вільного місця. Деякі з’явилися ще тоді, коли наша планета була зовсім молодою!"
      temperature:
        label: "Температура"
        value: "близько −140 °C"
