      volcanoes:
        label: "Вулкани"
        value: "понад 400"
        say: "На Іо понад чотириста вулканів, і багато з них вивергаються просто зараз! Деякі викидають лаву й газ вище за найвищі гори."
      temperature:
        label: "Температура"
        value: "близько −140 °C\nлава — понад +1 000 °C"
        say: "Поверхня Іо дуже холодна, але лава з його вулканів гарячіша, ніж у будь-якому вулкані в нас удома!"
      inside:
        label: "З чого складається"
        value: "кора, розплавлена мантія, ядро"
    compare: "Іо приблизно втричі вужчий за Землю — трохи більший за Місяць."
    inside:
      intro: "Зазирнімо всередину Іо!"
      layers:
        crust:
          name: "Кора"
          say: "Зверху — тонка кам’яна кора, жовта від сірки."
        mantle:
          name: "Розплавлена мантія"
          say: "Під нею — мантія, у якій багато розплавленого каміння. Звідти лава й виривається у вулкани."
        core:
          name: "Залізне ядро"
          say: "А в центрі — велике залізне ядро."
    facts:
      - "Іо — найвулканічніше місце в Сонячній системі."
      - "Жовтий, оранжевий і червоний кольори на Іо — це сірка з вулканів."
      - "Фонтани з вулканів Іо злітають на сотні кілометрів угору."
      - "Іо відкрив Галілео Галілей понад чотириста років тому разом з іще трьома великими супутниками Юпітера."

  europa:
    name: "Європа"
    kind: "Супутник Юпітера"
    intro: "Це Європа — крижаний супутник Юпітера. Під її льодом ховається величезний океан!"
    stats:
      diameter:
        label: "Діаметр"
        value: "3 122 км"
        say: "Європа трішки менша за наш Місяць."
      distance:
        label: "Від Юпітера"
        value: "671 000 км\nколо за 3,5 доби"
        say: "Європа облітає Юпітер за три з половиною дні."
      ocean:
        label: "Океан"
