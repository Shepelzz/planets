        value: "близько −210 °C"
        say: "На Нептуні дуже холодно — близько мінус двохсот десяти градусів! А ще там дмуть найсильніші вітри — швидші за літак!"
      inside:
        label: "З чого складається"
        value: "атмосфера, «льоди», ядро"
    compare: "Нептун теж майже вчетверо ширший за Землю!"
    inside:
      intro: "Зазирнімо всередину Нептуна!"
      layers:
        atmosphere:
          name: "Атмосфера"
          say: "Зверху — синя атмосфера з водню, гелію й метану, де дмуть найсильніші вітри."
        mantle:
          name: "Мантія з «льодів»"
