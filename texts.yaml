    compare: "Харон приблизно вдесятеро вужчий за Землю, але для супутника він напрочуд великий."
    inside:
      intro: "Зазирнімо всередину Харона!"
      layers:
        crust:
          name: "Крижана кора"
          say: "Зверху — товста кора з водяного льоду."
        core:
          name: "Кам’яне ядро"
