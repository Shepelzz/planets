        mantle:
          name: "Мантія"
          say: "Під ним — мантія з каміння й льоду."
        core:
          name: "Залізне ядро"
          say: "А в центрі — залізне ядро. Воно й робить Ганімед магнітом."
    facts:
      - "Ганімед більший за Меркурій, але важить удвічі менше, бо в ньому багато льоду."
      - "До Ганімеда летить європейський апарат «Джус». Він стане першим, хто кружлятиме навколо чужого супутника."
      - "На Ганімеді є світлі смуги з борознами й темні давні ділянки, вкриті кратерами."
      - "Ганімед названий на честь юнака з давньогрецьких міфів, який подавав напої богам."

  callisto:
    name: "Каллісто"
