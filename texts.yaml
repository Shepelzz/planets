        say: "Під крижаною кіркою Європи — солоний океан. Води в ньому, мабуть, більше, ніж у всіх морях і океанах нашої планети разом!"
      temperature:
        label: "Температура"
        value: "близько −160 °C"
        say: "На поверхні Європи дуже холодно, тому вода там замерзла в товстий лід."
      inside:
