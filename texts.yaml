      - "Відтоді як Нептун відкрили у 1846 році, він облетів Сонце лише один раз."
      - "Світлу Сонця потрібно понад 4 години, щоб долетіти до Нептуна."

  pluto:
    name: "Плутон"
    name_of: "Плутона"   # «Супутники …»
    kind: "Карликова планета"
    intro: "Плутон — карликова планета, далеко-далеко за Нептуном. Колись його вважали дев’ятою планетою!"
    stats:
      diameter:
        label: "Діаметр"
        value: "2 377 км"
        say: "Плутон зовсім маленький — менший навіть за наш Місяць! Тому його й назвали карликовою планетою."
      distance:
        label: "Від Сонця"
        value: "5,9 млрд км"
        say: "Плутон дуже-дуже далеко — майже в сорок разів далі від Сонця, ніж наша планета. Сонце звідти схоже на дуже яскраву зірку."
      day_year:
        label: "Доба і рік"
        value: "доба — 6,4 дня\nрік — 248 років"
        say: "Доба на Плутоні триває понад шість наших днів. А один рік — двісті сорок вісім років! Відколи Плутон відкрили, він не облетів Сонце ще жодного разу."
      moons:
        label: "Супутники"
        value: "5 — найбільший Харон"
        say: "У Плутона п’ять супутників. Найбільший — Харон, він лише вдвічі менший за самого Плутона!"
      temperature:
        label: "Температура"
        value: "близько −230 °C"
        say: "На Плутоні дуже холодно — близько мінус двохсот тридцяти градусів. Коли Плутон відлітає далеко від Сонця, його повітря замерзає й лягає на поверхню, як іній!"
      inside:
        label: "З чого складається"
        value: "лід, океан, каміння"
    compare: "Плутон уп’ятеро менший за нашу планету — навіть менший за Місяць!"
    inside:
      intro: "Зазирнімо всередину Плутона!"
      layers:
        crust:
          name: "Крижана кора"
          say: "Зверху — товста крижана кора. Лід там такий холодний, що твердий, як камінь!"
        ocean:
          name: "Підземний океан"
          say: "Під льодом, можливо, ховається океан з води. Учені ще з’ясовують, чи він справді там є!"
        core:
          name: "Кам’яне ядро"
          say: "А в центрі — велике кам’яне ядро."
    facts:
      - "До 2006 року Плутон вважали дев’ятою планетою. Потім учені вирішили, що він замалий, і назвали його карликовою планетою."
      - "На Плутоні є величезне світле «сердечко» — рівнина із замерзлого азоту."
      - "Плутон менший навіть за наш Місяць!"
      - "Назву Плутону придумала одинадцятирічна дівчинка з Англії — Венеція Берні."
      - "Космічний апарат New Horizons летів до Плутона майже десять років і 2015 року вперше його сфотографував зблизька."

  charon:
    name: "Харон"
    kind: "Супутник Плутона"
    intro: "Харон — найбільший супутник Плутона. Вони кружляють разом, ніби танцюють!"
    stats:
      diameter:
        label: "Діаметр"
        value: "1 212 км"
        say: "Харон удвічі менший за Плутон. Для супутника це дуже багато, тому деякі вчені називають їх подвійною планетою."
      distance:
        label: "Від Плутона"
        value: "19 600 км\nоблітає його за 6,4 дня"
        say: "Харон зовсім близько до Плутона й облітає його приблизно за шість днів. І весь час дивиться на Плутона одним і тим самим боком."
      temperature:
        label: "Температура"
        value: "близько −220 °C"
        say: "На Хароні дуже холодно — близько мінус двохсот двадцяти градусів."
      discovered:
        label: "Відкрили"
        value: "1978 року"
        say: "Харон відкрили тисяча дев’ятсот сімдесят восьмого року, майже через пів століття після Плутона."
      inside:
        label: "З чого складається"
        value: "лід і каміння"
    compare: "Харон приблизно вдесятеро менший за нашу планету."
    inside:
      intro: "Зазирнімо всередину Харона!"
      layers:
        crust:
          name: "Крижана кора"
          say: "Зверху — товста кора з водяного льоду."
        core:
          name: "Кам’яне ядро"
          say: "А всередині — кам’яне ядро."
    facts:
      - "Харон такий великий поруч із Плутоном, що вони кружляють навколо спільної точки між ними — ніби тримаються за руки й танцюють."
      - "Плутон і Харон завжди дивляться одне на одного одним і тим самим боком."
      - "На північному полюсі Харона є руда пляма. Учені назвали її Мордор — як чарівну країну з книжки «Володар перснів»."
      - "Харона назвали на честь човняра з давньогрецьких міфів, який перевозив мандрівників через річку."

