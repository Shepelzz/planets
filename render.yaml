services:
  - type: web
    name: planets
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # hashed JS/CSS bundles and planet maps never change under the same URL
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /textures/*
        name: Cache-Control
        value: public, max-age=604800
      # recordings are named by a hash of their text, so a changed phrase gets a new URL
      - path: /voice/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
