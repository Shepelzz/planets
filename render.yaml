services:
  - type: web
    name: planets
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # hashed JS/CSS bundles and planet maps never change under the same URL
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # maps and models are requested with a fingerprint of the file (?v=…, see vite.config.ts)
      - path: /textures/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # recordings are named by a hash of their text, so a changed phrase gets a new URL
      - path: /voice/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # basic hardening: no MIME sniffing, no framing by other sites, no camera/mic/location
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # the service worker must always be fresh, or a new release never reaches the browser
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    # every address has its own page (own link preview), see pages() in vite.config.ts
    routes:
      - type: rewrite
        source: /solar-system
        destination: /solar-system.html
      - type: rewrite
        source: /solar-system/
        destination: /solar-system.html
      - type: rewrite
        source: /sun
        destination: /sun.html
      - type: rewrite
        source: /sun/
        destination: /sun.html
      - type: rewrite
        source: /mercury
        destination: /mercury.html
      - type: rewrite
        source: /mercury/
        destination: /mercury.html
      - type: rewrite
        source: /venus
        destination: /venus.html
      - type: rewrite
        source: /venus/
        destination: /venus.html
      - type: rewrite
        source: /earth
        destination: /earth.html
      - type: rewrite
        source: /earth/
        destination: /earth.html
      - type: rewrite
        source: /moon
        destination: /moon.html
      - type: rewrite
        source: /moon/
        destination: /moon.html
